# Compiles every sketch on each push and PR, with the same arduino-cli and core
# versions as HaLjr, so a broken build shows up before anything is flashed.
name: Compile firmware

on:
  push:
    branches: [main]  # PR branches are covered by pull_request; avoids running twice
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: firmware/phase1-r4-finder
            fqbn: arduino:renesas_uno:unor4wifi
            core: arduino:renesas_uno@1.6.0
            libs: Arduino_Modulino@0.10.0
          - sketch: firmware/phase2-r4-display
            fqbn: arduino:renesas_uno:unor4wifi
            core: arduino:renesas_uno@1.6.0
            libs: Arduino_Modulino@0.10.0
          - sketch: firmware/phase2-xiao-sniffer
            fqbn: esp32:esp32:XIAO_ESP32S3
            core: esp32:esp32@3.3.12
          - sketch: firmware/phase2-xiao-sniffer
            fqbn: esp32:esp32:XIAO_ESP32C5:CDCOnBoot=cdc
            core: esp32:esp32@3.3.12
          - sketch: firmware/argus-ttgo-router
            fqbn: esp32:esp32:ttgo-lora32:Revision=TTGO_LoRa32_v21new
            core: esp32:esp32@3.3.12
            libs: '"LoRa@0.8.0" "Adafruit SSD1306@2.5.13"'
          - sketch: firmware/iolaus-ttgo-handheld
            fqbn: esp32:esp32:ttgo-lora32:Revision=TTGO_LoRa32_v21new
            core: esp32:esp32@3.3.12
            libs: '"LoRa@0.8.0" "Adafruit SSD1306@2.5.13"'
    name: ${{ matrix.sketch }} (${{ matrix.fqbn }})
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.3.1

      - name: Cache board cores
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-${{ matrix.core }}

      - name: Install core ${{ matrix.core }}
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "${{ matrix.core }}" --additional-urls "$ESP32_INDEX"

      - name: Install libraries
        if: matrix.libs
        run: arduino-cli lib install ${{ matrix.libs }}

      - name: Compile
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" --warnings default "${{ matrix.sketch }}"

  merlin:
    # Merlin (ESP32-P4 screen) is ESP-IDF, not Arduino.
    runs-on: ubuntu-latest
    name: firmware/merlin-p4-screen (ESP-IDF, esp32p4)
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32p4
          path: firmware/merlin-p4-screen
