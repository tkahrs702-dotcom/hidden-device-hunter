<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="t d">
<title id="t">System overview and power</title>
<desc id="d">How the boards connect in each phase, signal levels, and where each board gets power.</desc>
<rect x="0" y="0" width="1300" height="760" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="bold" fill="#111111">System overview: what talks to what, at which voltage</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">Solid = built in that phase. Dashed = optional. Red text = 5 V side, orange = 3.3 V side.</text>
<rect x="60" y="110" width="280" height="150" rx="10" fill="#0f7c80" stroke="#223" stroke-width="2"/>
<text x="72" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">Uno R4 WiFi  (5 V)</text>
<text x="72" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">Phase 1: scans Wi-Fi itself, beeps</text>
<text x="72" y="165.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">Phase 2: beeper + LED bars for the XIAO</text>
<text x="72" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">Serial1 on D0/D1, Qwiic Modulino buzzer</text>
<text x="72" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">Power: USB-C (computer or power bank)</text>
<rect x="274" y="98" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="307" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 1</text>
<rect x="60" y="330" width="280" height="90" rx="10" fill="#5a3d7a" stroke="#223" stroke-width="2"/>
<text x="72" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">Buzzer + 100 ohm</text>
<text x="72" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">passive piezo on D8</text>
<text x="72" y="385.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">beeps faster as signal rises</text>
<rect x="274" y="318" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="307" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 1</text>
<rect x="500" y="110" width="260" height="150" rx="10" fill="#1d4f91" stroke="#223" stroke-width="2"/>
<text x="512" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">Level shifter (BSS138)</text>
<text x="512" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">5 V &lt;-&gt; 3.3 V, both directions</text>
<text x="512" y="165.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">ch 1: R4 TX -&gt; XIAO RX</text>
<text x="512" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">ch 2: XIAO TX -&gt; R4 RX</text>
<text x="512" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">ch 3: P4 TX -&gt; R4 RX (opt.)</text>
<rect x="694" y="98" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="727" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 2</text>
<rect x="920" y="110" width="300" height="150" rx="10" fill="#2b2b2b" stroke="#223" stroke-width="2"/>
<text x="932" y="132" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">Seeed XIAO ESP32-C5  (3.3 V)</text>
<text x="932" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">2.4 + 5 GHz monitor, receive only</text>
<text x="932" y="165.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">maker table tags CAM / IOT</text>
<text x="932" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">UART D6/GPIO11 TX, D7/GPIO12 RX</text>
<text x="932" y="192.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">Power: own USB-C for bench tests</text>
<rect x="1154" y="98" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="1187" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 2</text>
<rect x="920" y="330" width="300" height="90" rx="10" fill="#666" stroke="#223" stroke-width="2"/>
<text x="932" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">Rokland directional antenna</text>
<text x="932" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">2.4/5 GHz, ordered, not delivered</text>
<text x="932" y="385.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">check RF connector on arrival</text>
<rect x="1154" y="318" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="1187" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 2</text>
<rect x="500" y="470" width="300" height="170" rx="10" fill="#1f3a5f" stroke="#223" stroke-width="2"/>
<text x="512" y="492" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">ESP32-P4 4.3&quot; board  (3.3 V)</text>
<text x="512" y="512.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">camera + LVGL heat map + crosshair</text>
<text x="512" y="525.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">UART to XIAO: GPIO5 RX / GPIO4 TX</text>
<text x="512" y="539.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">I2C GPIO7/8 to BNO085</text>
<text x="512" y="552.5" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">Power: USB-C or 3.7 V LiPo (J2)</text>
<text x="512" y="566.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">header 5V feeds the XIAO</text>
<rect x="734" y="458" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="767" y="474" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 3</text>
<rect x="920" y="520" width="300" height="70" rx="10" fill="#2d2d6b" stroke="#223" stroke-width="2"/>
<text x="932" y="542" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">BNO085 IMU</text>
<text x="932" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">I2C 0x4A on pins 2, 4, 6, 10</text>
<rect x="1154" y="508" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="1187" y="524" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 3</text>
<rect x="60" y="520" width="280" height="70" rx="10" fill="#2e7d32" stroke="#223" stroke-width="2"/>
<text x="72" y="542" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="white">OV5647 camera</text>
<text x="72" y="562.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#e8eef5">CSI, 15-pin 0.5 mm ribbon</text>
<rect x="274" y="508" width="66" height="22" rx="11" fill="white" stroke="#223" stroke-width="1.5"/>
<text x="307" y="524" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">Phase 3</text>
<path d="M 340 185 L 500 185" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 500 185 L 490.0 190.0 L 490.0 180.0 Z" fill="#d62728" stroke="none"/>
<path d="M 340 185 L 350.0 180.0 L 350.0 190.0 Z" fill="#d62728" stroke="none"/>
<text x="420" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">UART 5 V</text>
<path d="M 760 185 L 920 185" fill="none" stroke="#c25f00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 920 185 L 910.0 190.0 L 910.0 180.0 Z" fill="#c25f00" stroke="none"/>
<path d="M 760 185 L 770.0 180.0 L 770.0 190.0 Z" fill="#c25f00" stroke="none"/>
<text x="840" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">UART 3.3 V</text>
<path d="M 200 260 L 200 330" fill="none" stroke="#9467bd" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 200 330 L 195.0 320.0 L 205.0 320.0 Z" fill="#9467bd" stroke="none"/>
<text x="240" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">D8 tone</text>
<path d="M 1070 260 L 1070 330" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1070 330 L 1065.0 320.0 L 1075.0 320.0 Z" fill="#6b6b6b" stroke="none"/>
<text x="1100" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">coax</text>
<path d="M 1000 260 L 1000 290 L 760 290 L 760 470" fill="none" stroke="#c25f00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 760 470 L 755.0 460.0 L 765.0 460.0 Z" fill="#c25f00" stroke="none"/>
<path d="M 1000 260 L 1005.0 270.0 L 995.0 270.0 Z" fill="#c25f00" stroke="none"/>
<text x="880" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">UART 3.3 V direct (Phase 3)</text>
<path d="M 800 555 L 920 555" fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 920 555 L 910.0 560.0 L 910.0 550.0 Z" fill="#1f77b4" stroke="none"/>
<path d="M 800 555 L 810.0 550.0 L 810.0 560.0 Z" fill="#1f77b4" stroke="none"/>
<text x="860" y="547" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">I2C</text>
<path d="M 340 555 L 500 555" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 500 555 L 490.0 560.0 L 490.0 550.0 Z" fill="#2e7d32" stroke="none"/>
<text x="420" y="547" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">CSI</text>
<path d="M 560 470 L 560 260" fill="none" stroke="#8c564b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<path d="M 560 260 L 565.0 270.0 L 555.0 270.0 Z" fill="#8c564b" stroke="none"/>
<text x="500" y="380" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold" fill="#111111">opt. P4 -&gt; R4</text>
<rect x="60" y="670" width="1160" height="44.8" rx="6" fill="#fde2e1" stroke="#c33" stroke-width="1.2"/>
<text x="70" y="687.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">Voltage rule: the R4 is the only 5 V logic board. Every R4 &lt;-&gt; ESP32 signal goes through the shifter; XIAO &lt;-&gt; P4 and BNO085 &lt;-&gt; P4 are 3.3 V on both ends.</text>
<text x="70" y="701.85" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">Phase 2 bench wiring: separate USB power for R4 and XIAO, shared ground; do not join the 5 V rails. Connect XIAO D6 TX to R4 D0 RX through shifter channel 2.</text>
</svg>
