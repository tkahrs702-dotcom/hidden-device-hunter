<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, sans-serif" font-size="14">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">Phase 2: P4 main screen added to the C5 sniffer link (all 3.3 V)</text>

  <!-- C5 -->
  <rect x="40" y="80" width="200" height="230" rx="8" fill="#e8f1fb" stroke="#1f5f99" stroke-width="2"/>
  <text x="140" y="105" text-anchor="middle" font-weight="bold">XIAO ESP32-C5 sniffer</text>
  <text x="60" y="150">D7 = TX (crossed)</text>
  <text x="60" y="200">D6 = RX (crossed)</text>
  <text x="60" y="250">GND</text>
  <circle cx="240" cy="145" r="5" fill="#1f5f99"/>
  <circle cx="240" cy="195" r="5" fill="#1f5f99"/>
  <circle cx="240" cy="245" r="5" fill="#1f5f99"/>

  <!-- shifter + R4 (unchanged) -->
  <rect x="380" y="340" width="180" height="140" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="470" y="365" text-anchor="middle" font-weight="bold">Level shifter + R4</text>
  <text x="470" y="390" text-anchor="middle">unchanged, still the beeper</text>
  <text x="470" y="415" text-anchor="middle">(5 V side stays on the R4)</text>

  <!-- P4 -->
  <rect x="640" y="80" width="230" height="230" rx="8" fill="#eaf7ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="755" y="105" text-anchor="middle" font-weight="bold">ESP32-P4 4.3 in screen</text>
  <text x="755" y="125" text-anchor="middle">40-pin header</text>
  <text x="660" y="150">pin 11  GPIO5 (P4 RX)</text>
  <text x="660" y="200">pin 14  GPIO4 (P4 TX)</text>
  <text x="660" y="250">pin 5   GND</text>
  <text x="660" y="290" font-size="12">power: its own USB-C or LiPo</text>
  <circle cx="640" cy="145" r="5" fill="#2e7d32"/>
  <circle cx="640" cy="195" r="5" fill="#2e7d32"/>
  <circle cx="640" cy="245" r="5" fill="#2e7d32"/>

  <!-- W1 TX tap -->
  <line x1="240" y1="145" x2="640" y2="145" stroke="#d32f2f" stroke-width="3"/>
  <text x="440" y="138" text-anchor="middle" fill="#d32f2f">W1  C5 D7 (TX) to P4 pin 11</text>
  <line x1="300" y1="145" x2="300" y2="370" stroke="#d32f2f" stroke-width="3"/>
  <line x1="300" y1="370" x2="380" y2="370" stroke="#d32f2f" stroke-width="3"/>
  <circle cx="300" cy="145" r="5" fill="#d32f2f"/>
  <text x="308" y="300" fill="#d32f2f" font-size="12">existing wire to shifter stays</text>

  <!-- W3 optional TX -->
  <line x1="240" y1="195" x2="640" y2="195" stroke="#f57c00" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="440" y="188" text-anchor="middle" fill="#f57c00">W3 optional: P4 pin 14 to C5 D6, only with R4 TX unplugged</text>

  <!-- W2 GND -->
  <line x1="240" y1="245" x2="640" y2="245" stroke="#000" stroke-width="3"/>
  <text x="440" y="238" text-anchor="middle">W2  C5 GND to P4 pin 5</text>

  <text x="40" y="500" font-size="13" fill="#b00020" font-weight="bold">Never connect P4 header pins 1 or 3 (5 V) or anything from the R4's 5 V side to the C5 or P4 signal pins.</text>
</svg>
