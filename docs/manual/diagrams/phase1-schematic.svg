<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d">
<title id="t">Phase 1 schematic</title>
<desc id="d">D8 through R1 100 ohm to piezo BZ1 plus; BZ1 minus to GND. Power from USB-C.</desc>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="bold" fill="#111111">Phase 1 schematic</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">Electrical view of the same circuit. Reference designators match the wire list.</text>
<rect x="170" y="110" width="230" height="250" rx="6" fill="#eef7f7" stroke="#0f7c80" stroke-width="2"/>
<text x="285" y="134" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#111111">U1  Arduino Uno R4 WiFi</text>
<text x="285" y="152" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555">RA4M1, 5 V logic</text>
<line x1="400" y1="230" x2="440" y2="230" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<text x="392" y="234" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="end" font-weight="normal" fill="#111111">D8</text>
<line x1="400" y1="320" x2="440" y2="320" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<text x="392" y="324" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="end" font-weight="normal" fill="#111111">GND</text>
<line x1="130" y1="200" x2="170" y2="200" stroke="#d62728" stroke-width="1.5" stroke-linecap="round"/>
<text x="178" y="204" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" text-anchor="start" font-weight="normal" fill="#111111">USB-C</text>
<text x="126" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" font-weight="normal" fill="#555555">+5 V from</text>
<text x="126" y="203" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" font-weight="normal" fill="#555555">computer or</text>
<text x="126" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" font-weight="normal" fill="#555555">power bank</text>
<text x="285" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">tone via FspTimer ISR</text>
<text x="285" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">(beeper.h, ~2.5 kHz)</text>
<path d="M 440 230 L 498.0 230 L 501.6666666666667 223 L 509.0 237 L 516.3333333333334 223 L 523.6666666666666 237 L 531.0 223 L 538.3333333333334 237 L 542.0 230 L 600 230" fill="none" stroke="#111111" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="520.0" y="217" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold" fill="#111111">R1</text>
<text x="520.0" y="252" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="normal" fill="#111111">100 ohm 1/4 W</text>
<line x1="600" y1="230" x2="690" y2="230" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<line x1="690" y1="230" x2="690" y2="260" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<rect x="668" y="260" width="44" height="8" rx="0" fill="#111111" stroke="#111111" stroke-width="1"/>
<rect x="674" y="274" width="32" height="12" rx="0" fill="white" stroke="#111111" stroke-width="1.5"/>
<rect x="668" y="292" width="44" height="8" rx="0" fill="#111111" stroke="#111111" stroke-width="1"/>
<text x="656" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111111">+</text>
<text x="720" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#111111">BZ1  passive piezo</text>
<text x="720" y="297" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#555555">(not an &#x27;active&#x27; buzzer)</text>
<line x1="690" y1="300" x2="690" y2="320" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<line x1="440" y1="320" x2="690" y2="320" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="690" cy="320" r="3.5" fill="#111111" stroke="#111111" stroke-width="1"/>
<line x1="690" y1="320" x2="690" y2="328" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<line x1="681" y1="328" x2="699" y2="328" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="684" y1="332" x2="696" y2="332" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<line x1="687" y1="336" x2="693" y2="336" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
<text x="520" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#9467bd">net TONE</text>
<text x="520" y="312" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" font-weight="bold" fill="#111111">net GND</text>
<rect x="60" y="400" width="880" height="75.6" rx="6" fill="#fff7d6" stroke="#c9a400" stroke-width="1.2"/>
<text x="70" y="417.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">Why 100 ohm: a piezo is a small capacitor. Each time D8 flips, the resistor caps the charging spike at</text>
<text x="70" y="431.85" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">5 V / 100 ohm = 50 mA for a few microseconds; the average current is about 1 mA or less, inside the R4&#x27;s 8 mA per-pin rating.</text>
<text x="70" y="446.7" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">Variant: a 3-pin passive buzzer module needs no resistor. Module S -&gt; D8, module + -&gt; 5V, module - -&gt; GND.</text>
<text x="70" y="461.55" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">Do not drive a magnetic buzzer or speaker straight from D8; they need a transistor.</text>
</svg>
