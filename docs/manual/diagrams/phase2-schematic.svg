<text x="130" y="777.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">Power: everything runs from the R4&#x27;s USB-C. The R4 5V pin (about 4.7 V on USB) feeds the shifter&#x27;s HV side and the XIAO&#x27;s 5V input; the XIAO&#x27;s</text>
<text x="130" y="791.85" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">own regulator makes 3.3 V, which also sets the shifter&#x27;s LV side. Never feed the XIAO from its USB-C and the 5V pin at the same time.</text>
<text x="130" y="806.7" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">UART: 115200 8N1. The XIAO sends L / U / T / S lines (see firmware/phase2-r4-display). R4 -&gt; XIAO (S1, S2) is wired but not used yet.</text>
