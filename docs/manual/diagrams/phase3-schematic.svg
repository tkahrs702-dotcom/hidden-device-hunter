<text x="610.0" y="158" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="normal" fill="#555555">Waveshare 4.3&quot;, header pins shown</text>
<line x1="440" y1="190" x2="470" y2="190" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
<text x="476" y="194" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" text-anchor="start" font-weight="normal" fill="#111111">1 5V</text>
