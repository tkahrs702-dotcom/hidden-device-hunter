<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" role="img" aria-labelledby="t d">
<title id="t">Phase 3 schematic</title>
<desc id="d">P4, XIAO, BNO085, camera, battery and the optional R4 link as a schematic.</desc>
<rect x="0" y="0" width="1300" height="860" fill="#ffffff"/>
<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" font-weight="bold" fill="#111111">Phase 3 schematic (planned)</text>
<text x="24" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555555">All logic on this page is 3.3 V except the optional R4 link, which goes through shifter channel 3.</text>
