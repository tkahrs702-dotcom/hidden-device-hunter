<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase 2 wiring: UNO R4 WiFi, Adafruit 757, Seeed Studio XIAO ESP32-C5</title>
  <desc id="desc">Separately USB-powered R4 and XIAO C5 share ground. R4 D1 TX passes through shifter B1/A1 to XIAO D7 RX, reserved for future use. XIAO D6 TX passes through A2/B2 to R4 D0 RX for live readings. R4 5V supplies only shifter HV and XIAO 3V3 supplies LV. The R4 buzzer is a Qwiic Modulino.</desc>
  <defs>
    <style>
      .bg{fill:#f1f5f9}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.board{fill:#13253a;stroke:#0b1725;stroke-width:2}
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:400 16px system-ui,sans-serif;fill:#475569}
      .head{font:700 20px system-ui,sans-serif;fill:#0f172a}.text{font:600 15px system-ui,sans-serif;fill:#1e293b}
      .tiny{font:500 12px system-ui,sans-serif;fill:#475569}.boardtext{font:700 18px system-ui,sans-serif;fill:#f8fafc}
      .boardsub{font:500 14px system-ui,sans-serif;fill:#cbd5e1}.pin{fill:#fff;stroke:#64748b;stroke-width:2}
      .pwr{fill:none;stroke:#dc2626;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .logic{fill:none;stroke:#ea580c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .ref{fill:none;stroke:#64748b;stroke-width:4;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}
      .txr4{fill:none;stroke:#d97706;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .txc5{fill:none;stroke:#059669;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .warning{fill:#fff7ed;stroke:#fed7aa;stroke-width:2}.warn{font:600 14px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect class="bg" width="1500" height="900"/>
  <text class="title" x="55" y="58">Phase 2 wiring</text>
  <text class="sub" x="55" y="88">UNO R4 WiFi · Adafruit 757 level shifter · Seeed Studio XIAO ESP32-C5</text>

  <rect class="card" x="55" y="145" width="390" height="535" rx="20"/>
  <rect class="card" x="555" y="195" width="390" height="435" rx="20"/>
  <rect class="card" x="1055" y="145" width="390" height="535" rx="20"/>
  <text class="head" x="85" y="185">UNO R4 WiFi</text>
  <text class="tiny" x="85" y="210">5 V logic · powered from USB-C</text>
  <text class="head" x="595" y="235">Adafruit 757</text>
  <text class="tiny" x="595" y="260">Bidirectional level shifter</text>
  <text class="head" x="1085" y="185">Seeed Studio XIAO ESP32-C5</text>
  <text class="tiny" x="1085" y="210">3.3 V GPIO · powered from USB-C</text>

  <rect class="board" x="115" y="260" width="270" height="335" rx="18"/>
  <text class="boardtext" x="250" y="315" text-anchor="middle">Arduino</text>
  <text class="boardtext" x="250" y="342" text-anchor="middle">UNO R4 WiFi</text>
  <text class="boardsub" x="250" y="374" text-anchor="middle">Serial1 · D0 / D1</text>
  <rect x="176" y="470" width="148" height="55" rx="10" fill="#164e63" stroke="#67e8f9" stroke-width="2"/>
  <text class="boardsub" x="250" y="494" text-anchor="middle">Qwiic</text>
  <text class="boardsub" x="250" y="514" text-anchor="middle">Modulino Buzzer</text>
  <text class="boardsub" x="250" y="558" text-anchor="middle">Built-in LED matrix</text>
  <text class="tiny" x="250" y="638" text-anchor="middle">USB-C power (separate)</text>

  <rect class="board" x="1115" y="260" width="270" height="335" rx="18"/>
  <text class="boardtext" x="1250" y="315" text-anchor="middle">XIAO</text>
  <text class="boardtext" x="1250" y="342" text-anchor="middle">ESP32-C5</text>
  <text class="boardsub" x="1250" y="381" text-anchor="middle">D6 · GPIO11 · TX</text>
  <text class="boardsub" x="1250" y="411" text-anchor="middle">D7 · GPIO12 · RX</text>
  <rect x="1175" y="460" width="150" height="64" rx="10" fill="#1e3a55" stroke="#94a3b8" stroke-width="2"/>
  <text class="boardsub" x="1250" y="486" text-anchor="middle">RF connector</text>
  <text class="tiny" x="1250" y="508" text-anchor="middle">Rokland antenna pending</text>
  <text class="tiny" x="1250" y="555" text-anchor="middle">USB-C power (separate)</text>

  <rect x="605" y="290" width="290" height="260" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text class="text" x="750" y="322" text-anchor="middle">HIGH (5 V)             LOW (3.3 V)</text>
  <text class="text" x="625" y="370">HV</text><text class="text" x="875" y="370" text-anchor="end">LV</text>
  <text class="text" x="625" y="430">B1</text><text class="text" x="875" y="430" text-anchor="end">A1</text>
  <text class="text" x="625" y="495">B2</text><text class="text" x="875" y="495" text-anchor="end">A2</text>
  <text class="text" x="625" y="535">GND</text><text class="text" x="875" y="535" text-anchor="end">GND</text>
  <text class="tiny" x="750" y="580" text-anchor="middle">Channel 1: B1 ↔ A1 · Channel 2: B2 ↔ A2</text>

  <path class="pwr" d="M445 300 H500 V370 H605"/>
  <path class="logic" d="M1055 370 H895"/>
  <path class="ref" d="M445 625 H500 V535 H605"/>
  <path class="ref" d="M895 535 H1000 V625 H1055"/>
  <path class="txr4" d="M445 400 H530 V430 H605"/>
  <path class="txr4" d="M895 430 H1000 V430 H1055"/>
  <path class="txc5" d="M1055 490 H1000 V495 H895"/>
  <path class="txc5" d="M605 495 H530 V500 H445"/>

  <text class="text" x="405" y="305" text-anchor="end">5V</text>
  <circle class="pin" cx="445" cy="300" r="7"/>
  <text class="text" x="405" y="405" text-anchor="end">D1 TX</text>
  <circle class="pin" cx="445" cy="400" r="7"/>
  <text class="text" x="405" y="505" text-anchor="end">D0 RX</text>
  <circle class="pin" cx="445" cy="500" r="7"/>
  <text class="text" x="405" y="630" text-anchor="end">GND</text>
  <circle class="pin" cx="445" cy="625" r="7"/>

  <text class="text" x="1080" y="305">5V pin — no connection</text>
  <text class="text" x="1080" y="380">3V3 → LV</text>
  <text class="text" x="1080" y="445">D7 RX</text>
  <text class="text" x="1080" y="505">D6 TX</text>
  <text class="text" x="1080" y="630">GND</text>
  <circle class="pin" cx="1055" cy="300" r="7"/>
  <circle class="pin" cx="1055" cy="370" r="7"/>
  <circle class="pin" cx="1055" cy="430" r="7"/>
  <circle class="pin" cx="1055" cy="490" r="7"/>
  <circle class="pin" cx="1055" cy="625" r="7"/>
  <text class="tiny" x="530" y="415" text-anchor="middle">reserved</text>
  <text class="tiny" x="530" y="485" text-anchor="middle">live data</text>

  <line x1="75" y1="745" x2="130" y2="745" class="pwr"/>
  <text class="tiny" x="143" y="750">5 V shifter reference</text>
  <line x1="275" y1="745" x2="330" y2="745" class="logic"/>
  <text class="tiny" x="343" y="750">3.3 V shifter reference</text>
  <line x1="555" y1="745" x2="610" y2="745" class="ref"/>
  <text class="tiny" x="623" y="750">shared ground</text>
  <line x1="785" y1="745" x2="840" y2="745" class="txr4"/>
  <text class="tiny" x="853" y="750">R4 TX → XIAO RX (reserved)</text>
  <line x1="1130" y1="745" x2="1185" y2="745" class="txc5"/>
  <text class="tiny" x="1198" y="750">XIAO TX → R4 RX (live)</text>

  <rect class="warning" x="55" y="795" width="1390" height="70" rx="14"/>
  <text class="warn" x="80" y="825">Power each board from its own USB-C during the UART test. Do not connect their 5 V rails.</text>
  <text class="tiny" x="80" y="849">R4 5V is only the shifter HV reference; XIAO 3V3 supplies LV. All UART signals pass through the level shifter.</text>
</svg>
